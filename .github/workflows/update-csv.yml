name: Sync OneDrive CSVon:  schedule:    - cron: "0 */2 * * *"   # every 2 hours  workflow_dispatch:jobs:  sync:    runs-on: ubuntu-latest    steps:    - name: Checkout repo      uses: actions/checkout@v4    - name: Download CSV from OneDrive      run: |        curl -L -o assignments_report.csv "https://houtx-my.sharepoint.com/:x:/r/personal/tho_le_houstontx_gov/Documents/Documents/Chart/Fire%20CEs/assignments_report.csv?download=1"        # Fail if file is empty or HTML        if [ ! -s assignments_report.csv ]; then          echo "Downloaded file is empty — aborting."          exit 1        fi        if grep -q "<html" assignments_report.csv; then          echo "Downloaded HTML instead of CSV — aborting."          exit 1        fi    - name: Commit changes      run: |        git config user.name "github-actions"        git config user.email "github-actions@github.com"        git add assignments_report.csv        git diff --cached --quiet || git commit -m "Auto-update CSV"        git push